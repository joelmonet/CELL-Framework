name: Cell CLAP contracts

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  clap-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: free-audio/clap
          ref: a47f6badb49d948fd009998f28309cdab78979c9
          path: ci-clap
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: free-audio/clap-validator
          # Contains the upstream fix for crawling multi-preset containers.
          ref: 91ee84082fdb4aeb1d8cdc96a285a886333ca895
          path: ci-clap-validator
          persist-credentials: false
      - name: Install the X11 and WebKit test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libgtk-3-0t64 libwebkit2gtk-4.1-0 xvfb xauth
      - name: Build the installed SDK and CLAP fixtures
        run: |
          cmake -S framework -B "$RUNNER_TEMP/cell-build" -DCMAKE_BUILD_TYPE=Release -DCELL_SDK_WEBVIEW=ON
          cmake --build "$RUNNER_TEMP/cell-build" --parallel 3
          cmake --install "$RUNNER_TEMP/cell-build" --prefix "$RUNNER_TEMP/cell-sdk"
          cmake -S tests/sdk_transport_consumer -B "$RUNNER_TEMP/cell-host" -DCMAKE_BUILD_TYPE=Release \
            "-DCell_DIR=$RUNNER_TEMP/cell-sdk/lib/cmake/Cell" \
            "-DCELL_TRANSPORT_CLAP_SDK=$GITHUB_WORKSPACE/ci-clap" -DCELL_TRANSPORT_CLAP_EDITOR_TEST=ON
          cmake --build "$RUNNER_TEMP/cell-host" --parallel 3
          xvfb-run -a ctest --test-dir "$RUNNER_TEMP/cell-host" --output-on-failure --no-tests=error
      - name: Build the generated quickstart projects from the installed SDK
        run: |
          cell="$RUNNER_TEMP/cell-sdk/bin/cell"
          "$cell" new BankedTrim --template banked --output "$RUNNER_TEMP/BankedTrim"
          "$cell" new PolySine --template instrument --output "$RUNNER_TEMP/PolySine"
          "$cell" run "$RUNNER_TEMP/BankedTrim" --build-only --build-dir "$RUNNER_TEMP/cell-banked-build"
          "$cell" run "$RUNNER_TEMP/PolySine" --build-only --build-dir "$RUNNER_TEMP/cell-instrument-build"
          python3 tests/test_project_generator.py "$cell"
          node examples/sdk_banked/export.cjs "$RUNNER_TEMP/banked-exports"
          cmp examples/sdk_banked/cell-plugin-editor.html "$RUNNER_TEMP/banked-exports/cell-plugin-editor.html"
          cmp examples/sdk_banked/cell-ui-bindings.hpp "$RUNNER_TEMP/banked-exports/cell-ui-bindings.hpp"
      - name: Exercise the banked Designer panel with a native parameter snapshot
        run: |
          npm install --prefix "$RUNNER_TEMP/cell-browser" --no-save --no-package-lock playwright@1.62.1
          chromium=$(command -v google-chrome || command -v chromium || true)
          if [[ -z "$chromium" ]]; then
            node "$RUNNER_TEMP/cell-browser/node_modules/playwright/cli.js" install chromium
          fi
          export CELL_CHROMIUM="$chromium"
          export CELL_PLAYWRIGHT_MODULE="$RUNNER_TEMP/cell-browser/node_modules/playwright"
          export CELL_BANKED_FIXTURE="$RUNNER_TEMP/cell-banked-build/project_banked_check"
          node tests/ui_designer_browser_tests.cjs
      - name: Validate parameter events, conversions and preset discovery
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          cargo +1.95.0 build --locked --release --manifest-path ci-clap-validator/Cargo.toml -p clap-validator
          ci-clap-validator/target/release/clap-validator validate \
            --include '^(param-set-events|param-set-no-cookies|param-conversions|preset-discovery-.*)$' \
            "$RUNNER_TEMP/cell-host/Cell Transport Test.clap"
