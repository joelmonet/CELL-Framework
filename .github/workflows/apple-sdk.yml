name: Cell Apple SDK

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  apple-sdk:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: macosx
            arch: arm64
            runner: macos-15
            deployment: "15.0"
          - sdk: macosx
            arch: x86_64
            runner: macos-15-intel
            deployment: "15.0"
          - sdk: iphoneos
            arch: arm64
            runner: macos-15
            deployment: "17.0"
          - sdk: iphonesimulator
            arch: arm64
            runner: macos-15
            deployment: "17.0"
    name: ${{ matrix.sdk }} ${{ matrix.arch }}
    env:
      APPLE_ARCH: ${{ matrix.arch }}
      APPLE_SDK: ${{ matrix.sdk }}
      APPLE_DEPLOYMENT: ${{ matrix.deployment }}
    steps:
      - uses: actions/checkout@v4
      # v8.2.3 supplies floating-point parsing on older Apple runtimes.
      - uses: actions/checkout@v4
        with:
          repository: fastfloat/fast_float
          ref: 01ce95dfe46abccf3264fbccf9f5139ea9016cd2
          path: ci-fast-float
          persist-credentials: false
      # miniaudio 0.11.23 supplies the CoreAudio backend for macOS.
      - uses: actions/checkout@v4
        if: matrix.sdk == 'macosx'
        with:
          repository: mackron/miniaudio
          ref: f40cf03f80cdb7e741d43e53b7e706e8c1394bcf
          path: ci-miniaudio
          persist-credentials: false
      # AudioUnitSDK 1.4.0 supplies Apple's AUv2 effect base classes.
      - uses: actions/checkout@v4
        if: matrix.sdk == 'macosx'
        with:
          repository: apple/AudioUnitSDK
          ref: bd98b31feff57a15989fcfab4cd86dc63382b1ac
          path: ci-audio-unit-sdk
          persist-credentials: false
      - name: Package and extract the standalone SDK source
        run: |
          python3 tools/package_framework.py . "$RUNNER_TEMP/cell-sdk.zip"
          unzip -q "$RUNNER_TEMP/cell-sdk.zip" -d "$RUNNER_TEMP/cell-source"
      - name: Build and install the SDK and link an independent consumer
        id: build_sdk
        run: |
          xcodebuild -version
          xcrun --sdk "$APPLE_SDK" --show-sdk-version
          cmake_args=(
            -G Xcode
            "-DCMAKE_OSX_SYSROOT=$APPLE_SDK"
            "-DCMAKE_OSX_ARCHITECTURES=$APPLE_ARCH"
            "-DCMAKE_OSX_DEPLOYMENT_TARGET=$APPLE_DEPLOYMENT"
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          )
          sdk_args=(-DCELL_SDK_AUV3_EXAMPLE=ON)
          if [[ "$APPLE_SDK" == macosx ]]; then
            sdk_args+=(
              -DCELL_SDK_EXAMPLES=ON
              -DCELL_SDK_TESTS=ON
              -DCELL_SDK_AUDIO_DEVICE=ON
              "-DCELL_MINIAUDIO_INCLUDE_DIR=$GITHUB_WORKSPACE/ci-miniaudio"
              "-DCELL_GAIN_AU_SDK=$GITHUB_WORKSPACE/ci-audio-unit-sdk"
            )
          else
            cmake_args+=(-DCMAKE_SYSTEM_NAME=iOS)
          fi
          cmake -S "$RUNNER_TEMP/cell-source/Cell-Framework/framework" \
            -B "$RUNNER_TEMP/cell-build" "${cmake_args[@]}" "${sdk_args[@]}" \
            "-DCELL_FAST_FLOAT_INCLUDE_DIR=$GITHUB_WORKSPACE/ci-fast-float/include"
          cmake --build "$RUNNER_TEMP/cell-build" --config Release --parallel 3
          cmake --install "$RUNNER_TEMP/cell-build" --config Release --prefix "$RUNNER_TEMP/cell-sdk"
          exports="$RUNNER_TEMP/cell-project-exports"
          example="$RUNNER_TEMP/cell-source/Cell-Framework/examples/auv3_gain"
          mkdir -p "$exports"
          cp "$example/Cell Gain Editor.html" "$exports/cell-plugin-editor.html"
          cp "$example/cell-ui-bindings.hpp" "$exports/cell-ui-bindings.hpp"
          "$RUNNER_TEMP/cell-sdk/bin/cell" new GeneratedGain --format auv3 \
            --id com.example.cell.generatedgain --au-subtype CgV3 --au-manufacturer Cell \
            --designer-dir "$exports" --output "$RUNNER_TEMP/cell-project"
          cmake -S "$RUNNER_TEMP/cell-project" -B "$RUNNER_TEMP/cell-project-build" "${cmake_args[@]}" \
            "-DCell_DIR=$RUNNER_TEMP/cell-sdk/lib/cmake/Cell"
          cmake --build "$RUNNER_TEMP/cell-project-build" --config Release --target project_auv3_app --parallel 3
          ctest --test-dir "$RUNNER_TEMP/cell-project-build" -C Release -R '^auv3_bundle$' --output-on-failure --no-tests=error
          cmake -S "$RUNNER_TEMP/cell-source/Cell-Framework/tests/sdk_audio_files_consumer" \
            -B "$RUNNER_TEMP/cell-consumer" "${cmake_args[@]}" \
            "-DCell_DIR=$RUNNER_TEMP/cell-sdk/lib/cmake/Cell"
          cmake --build "$RUNNER_TEMP/cell-consumer" --config Release --parallel 3
          if [[ "$APPLE_SDK" == macosx ]]; then
            cmake -S "$RUNNER_TEMP/cell-source/Cell-Framework/tests/sdk_transport_consumer" \
              -B "$RUNNER_TEMP/cell-transport" "${cmake_args[@]}" \
              "-DCell_DIR=$RUNNER_TEMP/cell-sdk/lib/cmake/Cell"
            cmake --build "$RUNNER_TEMP/cell-transport" --config Release --parallel 3
          fi
      - name: Run native macOS contracts
        if: matrix.sdk == 'macosx'
        run: |
          mkdir -p "$RUNNER_TEMP/cell-results"
          result=0
          ctest --test-dir "$RUNNER_TEMP/cell-build" -C Release --output-on-failure --no-tests=error \
            --output-junit "$RUNNER_TEMP/cell-results/sdk.xml" || result=1
          ctest --test-dir "$RUNNER_TEMP/cell-consumer" -C Release --output-on-failure --no-tests=error \
            --output-junit "$RUNNER_TEMP/cell-results/consumer.xml" || result=1
          ctest --test-dir "$RUNNER_TEMP/cell-transport" -C Release --output-on-failure --no-tests=error \
            --output-junit "$RUNNER_TEMP/cell-results/transport.xml" || result=1
          exit "$result"
      - name: Validate and render the Audio Unit in Core Audio
        if: matrix.sdk == 'macosx'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cell-results" "$HOME/Library/Audio/Plug-Ins/Components"
          component="$HOME/Library/Audio/Plug-Ins/Components/Cell Gain Example.component"
          ditto "$RUNNER_TEMP/cell-build/gain-example/Release/Cell Gain Example.component" "$component"
          codesign --force --sign - "$component"
          codesign --verify --strict "$component"
          killall -u "$(id -un)" AudioComponentRegistrar 2>/dev/null || true
          auval -v aufx CGan Cell 2>&1 | tee "$RUNNER_TEMP/cell-results/auval.txt"
          grep -q 'AU VALIDATION SUCCEEDED' "$RUNNER_TEMP/cell-results/auval.txt"
          "$RUNNER_TEMP/cell-build/gain-example/Release/cell_au_gain_host" 2>&1 |
            tee "$RUNNER_TEMP/cell-results/au-render.txt"
      - name: Discover and render the registered AUv3 extensions in Core Audio
        if: "!cancelled() && matrix.sdk == 'macosx' && steps.build_sdk.outcome == 'success'"
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cell-results" "$HOME/Applications"
          app="$HOME/Applications/CellAUv3Host.app"
          plugins="$app/Contents/PlugIns"
          extensions=('Cell Gain.appex' 'Cell MIDI Probe.appex' 'Cell Instrument Probe.appex')
          entitlements="$RUNNER_TEMP/cell-sdk/lib/cmake/Cell/CellAUv3MacSandbox.entitlements"
          ditto "$RUNNER_TEMP/cell-build/macos-auv3/Release/CellAUv3Host.app" "$app"
          for extension in "${extensions[@]}"; do
            codesign --force --sign - --entitlements "$entitlements" "$plugins/$extension"
          done
          codesign --force --sign - --entitlements "$entitlements" "$app"
          codesign --verify --deep --strict "$app"
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$app"
          for extension in "${extensions[@]}"; do
            pluginkit -a "$plugins/$extension"
          done
          {
            pluginkit -m -v -i com.example.cell.auv3.gain.effect
            pluginkit -m -v -i com.example.cell.auv3.gain.midiprobe
            pluginkit -m -v -i com.example.cell.auv3.gain.instrumentprobe
          } 2>&1 | tee "$RUNNER_TEMP/cell-results/auv3-registration.txt"
          "$app/Contents/MacOS/CellAUv3Host" 2>&1 |
            tee "$RUNNER_TEMP/cell-results/auv3-render.txt"
          grep -qx PASS "$RUNNER_TEMP/cell-results/auv3-render.txt"
      - name: Discover and render the installed AUv3 extensions on iOS Simulator
        if: matrix.sdk == 'iphonesimulator'
        timeout-minutes: 12
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cell-results"
          app=$(find "$RUNNER_TEMP/cell-build/ios-auv3" -name CellAUv3Host.app -type d -print -quit)
          test -n "$app"
          bundle=com.example.cell.auv3.gain
          for extension in 'Cell Gain.appex' 'Cell MIDI Probe.appex' 'Cell Instrument Probe.appex'; do
            codesign --force --sign - "$app/PlugIns/$extension"
          done
          codesign --force --sign - "$app"
          codesign --verify --deep --strict "$app"
          device=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          iphones = [d for runtime, devices in json.load(sys.stdin)["devices"].items()
                     if ".iOS-" in runtime for d in devices if d["name"].startswith("iPhone")]
          devices = sorted(iphones, key=lambda d: d["state"] != "Booted")
          if not devices:
              sys.exit("No iOS Simulator iPhone is available")
          print(devices[0]["udid"])
          ')
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$app"
          data=$(xcrun simctl get_app_container "$device" "$bundle" data)
          rm -f "$data/Documents/AUv3-result.txt"
          xcrun simctl launch --terminate-running-process "$device" "$bundle" |
            tee "$RUNNER_TEMP/cell-results/auv3-launch.txt"
          for ((attempt = 0; attempt < 60; ++attempt)); do
            if [[ -s "$data/Documents/AUv3-result.txt" ]]; then
              cp "$data/Documents/AUv3-result.txt" "$RUNNER_TEMP/cell-results/auv3-render.txt"
              cat "$RUNNER_TEMP/cell-results/auv3-render.txt"
              grep -qx PASS "$RUNNER_TEMP/cell-results/auv3-render.txt"
              exit
            fi
            sleep 1
          done
          echo "The AUv3 host app did not record a result within 60 seconds." |
            tee "$RUNNER_TEMP/cell-results/auv3-render.txt"
          exit 1
      - name: Preserve iOS Simulator AUv3 results
        if: always() && matrix.sdk == 'iphonesimulator'
        uses: actions/upload-artifact@v4
        with:
          name: cell-ios-auv3-simulator
          path: ${{ runner.temp }}/cell-results/
          if-no-files-found: ignore
      - name: Preserve native macOS contract results
        if: always() && matrix.sdk == 'macosx'
        uses: actions/upload-artifact@v4
        with:
          name: cell-macos-contracts-${{ matrix.arch }}
          path: ${{ runner.temp }}/cell-results/
          if-no-files-found: ignore
