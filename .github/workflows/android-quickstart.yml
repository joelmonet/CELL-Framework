name: Cell Android quickstart

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  android-quickstart:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: fastfloat/fast_float
          ref: 01ce95dfe46abccf3264fbccf9f5139ea9016cd2
          path: ci-fast-float
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: mackron/miniaudio
          ref: f40cf03f80cdb7e741d43e53b7e706e8c1394bcf
          path: ci-miniaudio
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@41ad77ca97e46ee2e825d5e6b9a95d8169fcc44c # v4.4.2
        with:
          gradle-version: '8.11.1'
      - name: Build and install the SDK for both Android ABIs
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdk_tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          printf '%s\n' "$sdk_tools" "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$ANDROID_HOME" "$ANDROID_HOME" >> "$GITHUB_ENV"
          "$sdk_tools/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.31.6'
          cmake="$ANDROID_HOME/cmake/3.31.6/bin/cmake"
          export PATH="$ANDROID_HOME/cmake/3.31.6/bin:$PATH"
          for abi in arm64-v8a x86_64; do
            build="$RUNNER_TEMP/sdk-build-$abi"
            "$cmake" -S framework -B "$build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
              "-DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/28.2.13676358/build/cmake/android.toolchain.cmake" \
              "-DANDROID_ABI=$abi" -DANDROID_PLATFORM=android-28 \
              "-DCELL_FAST_FLOAT_INCLUDE_DIR=$GITHUB_WORKSPACE/ci-fast-float/include" \
              -DCELL_SDK_AUDIO_DEVICE=ON "-DCELL_MINIAUDIO_INCLUDE_DIR=$GITHUB_WORKSPACE/ci-miniaudio"
            "$cmake" --build "$build" --parallel 4
            "$cmake" --install "$build" --prefix "$RUNNER_TEMP/android-cell-sdk/$abi"
          done
      - name: Enable hardware virtualization for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build and open a generated Android starter
        uses: reactivecircus/android-emulator-runner@0a638108440efd5c7f980e6ba145dbcdd8f32009 # v2.37.0
        with:
          api-level: 35
          target: default
          arch: x86_64
          disable-animations: true
          script: |
            "$RUNNER_TEMP/android-cell-sdk/x86_64/bin/cell" new PocketTrim --template mobile --id org.cell.quickstart.pockettrim --output "$RUNNER_TEMP/PocketTrim"
            "$RUNNER_TEMP/android-cell-sdk/x86_64/bin/cell" run "$RUNNER_TEMP/PocketTrim" --android-cell-sdk "$RUNNER_TEMP/android-cell-sdk"
            timeout 60 bash -c 'until pid=$(adb shell pidof org.cell.quickstart.pockettrim) && adb logcat -d --pid="$pid" -s CellDesigner:I | grep -F "Editor bridge connected"; do sleep 2; done'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cell-android-quickstart
          path: |
            ${{ runner.temp }}/PocketTrim/.cell-run/
            ${{ runner.temp }}/PocketTrim/android/build/outputs/apk/debug/*.apk
          include-hidden-files: true
          if-no-files-found: ignore
